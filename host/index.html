<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ClinForge Health AI</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:820px;margin:2rem auto;padding:0 1rem;color:#1b2733}
 .banner{background:#fff4e5;border:1px solid #f0c36d;padding:.5rem .75rem;border-radius:6px;font-size:.9rem}
 #log div{margin:.75rem 0;padding:.6rem .8rem;border-radius:6px;white-space:pre-wrap}
 .user{background:#e8f1fb}.bot{background:#f3f4f6}.meta{font-size:.8rem;color:#5b6670}
 input,select,button{font:inherit;padding:.4rem}#msg{width:60%}
</style></head><body>
<h1>ClinForge Health AI</h1>
<p class="banner">Synthetic data only. Not for clinical care or medical decision-making.</p>
<p>Signed in as <select id="tok">
 <option value="tok_adams_valid">Dr. Adams</option>
 <option value="tok_baker_valid">Dr. Baker</option>
 <option value="tok_clark_valid">Nurse Clark</option>
 <option value="tok_adams_expired">Dr. Adams (expired token)</option>
</select></p>
<p class="meta" style="font-size:.85rem"><a href="/views.html">Clinical views: lab trends and encounter timeline</a></p>
<div id="log"></div>
<form id="f"><input id="msg" placeholder="Ask about one of your patients, e.g. medications for Howell" autofocus>
<button>Send</button></form>
<script src="/host.js"></script>
</body></html>
